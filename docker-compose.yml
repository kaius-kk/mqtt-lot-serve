services:
  # 1. EMQX MQTT Broker
  emqx:
    image: emqx/emqx:6.2.0
    container_name: emqx
    ports:
      - "1883:1883"   # MQTT TCP 端口
      - "8083:8083"   # MQTT WebSocket 端口
      - "8084:8084"   # MQTT WebSocket SSL 端口
      - "8883:8883"   # MQTT SSL 端口
      - "18083:18083" # Dashboard 管理界面
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=127.0.0.1
    networks:
      - iot-net
  # 2. MySQL Database
  mysql:
    image: mysql:9.7.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: iot_db
      TZ: Asia/Shanghai
    volumes:
      - ./services/mysql/data:/var/lib/mysql
      - ./services/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - iot-net
networks:
  iot-net:
    driver: bridge
